services:
  app:
    build:
      context: ./admin
      target: development
    ports:
      - '3006:3006'
    volumes:
      - ./admin:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '1000'
      VITE_ENABLE_DEVTOOLS: 'false'

  server:
    build:
      context: ./server
    ports:
      - '8081:8080'
    volumes:
      - ./server:/app
      - go_modules:/go/pkg/mod
    environment:
      HTTP_SERVICES_POSTGRES_HOST: postgres
      HTTP_SERVICES_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      HTTP_SERVICES_REDIS_HOST: redis:6379
      HTTP_SERVICES_REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
      HTTP_SERVICES_FACE_RECOGNITION_ENABLED: ${FACE_RECOGNITION_ENABLED:-false}
      HTTP_SERVICES_FACE_RECOGNITION_ACCESS_KEY_ID: ${FACE_RECOGNITION_ACCESS_KEY_ID:-}
      HTTP_SERVICES_FACE_RECOGNITION_ACCESS_KEY_SECRET: ${FACE_RECOGNITION_ACCESS_KEY_SECRET:-}
      HTTP_SERVICES_FACE_RECOGNITION_ENDPOINT: ${FACE_RECOGNITION_ENDPOINT:-cloudauth.cn-shanghai.aliyuncs.com}
      HTTP_SERVICES_FACE_RECOGNITION_SCENE_ID: ${FACE_RECOGNITION_SCENE_ID:-0}
      HTTP_SERVICES_FACE_RECOGNITION_RETURN_URL: ${FACE_RECOGNITION_RETURN_URL:-http://localhost:5173/verification?face_return=1}
      HTTP_SERVICES_FACE_RECOGNITION_STORAGE_DIR: /app/private/verification
    command: >
      sh -c "go run main.go --migrate && go run main.go --dev"


    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d server']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-local-redis-password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}

  production:
    build:
      context: ./admin
      target: production
    ports:
      - '8080:80'
    profiles:
      - production
    depends_on:
      server:
        condition: service_started

volumes:
  node_modules:
  go_modules:
  postgres_data:
  redis_data:
